name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: App version tag (release and mirror only)
        required: false
        type: string
      mode:
        description: Operation
        type: choice
        options: [release, mirror, tools]
        default: release

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    if: inputs.mode == 'release'
    permissions:
      contents: read
    name: Build (${{ matrix.target }})
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos, os: macos-latest}
          - {target: windows, os: ubuntu-latest}
          - {target: linux, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: everroam/lisbit
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5
      - name: Build
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ matrix.target == 'macos' && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ matrix.target == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.target == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if python3 scripts/release/ci.py build > "$RUNNER_TEMP/release.log" 2>&1; then
            echo 'Build completed.'
          else
            python3 scripts/release/ci.py failure-stage 2>/dev/null || echo 'stage=config'
            echo 'Build failed.'
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: |
          if python3 scripts/release/ci.py cleanup > "$RUNNER_TEMP/cleanup.log" 2>&1; then
            echo 'Cleanup completed.'
          else
            python3 scripts/release/ci.py failure-stage 2>/dev/null || echo 'stage=config'
            echo 'Cleanup failed.'
            exit 1
          fi

  publish:
    name: Publish
    needs: build
    if: ${{ !cancelled() && (inputs.mode == 'mirror' || (inputs.mode == 'release' && needs.build.result == 'success')) }}
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: everroam/lisbit
          ref: ${{ inputs.mode == 'mirror' && 'main' || format('refs/tags/{0}', inputs.tag) }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.mode == 'mirror' && 'mirror' || 'publish' }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if python3 scripts/release/ci.py "$RELEASE_OPERATION" > "$RUNNER_TEMP/release.log" 2>&1; then
            echo 'Publication completed.'
          else
            python3 scripts/release/ci.py failure-stage 2>/dev/null || echo 'stage=config'
            echo 'Publication failed.'
            exit 1
          fi

  tools-build:
    if: inputs.mode == 'tools'
    permissions:
      contents: read
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin-arm64, os: macos-latest, python: python3}
          - {target: darwin-amd64, os: macos-15-intel, python: python3}
          - {target: windows-amd64, os: windows-latest, python: python}
          - {target: linux-amd64, os: ubuntu-22.04, python: python3}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: everroam/lisbit
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false
      - name: Build tools
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MACOS_CERTIFICATE: ${{ startsWith(matrix.target, 'darwin') && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.target, 'darwin') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if ${{ matrix.python }} scripts/release/ci.py tools-build > "$RUNNER_TEMP/tools.log" 2>&1; then
            echo 'Tools build completed.'
          else
            ${{ matrix.python }} scripts/release/ci.py failure-stage 2>/dev/null || echo 'stage=config'
            echo 'Tools build failed.'
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: |
          if ${{ matrix.python }} scripts/release/ci.py cleanup > "$RUNNER_TEMP/cleanup.log" 2>&1; then
            echo 'Cleanup completed.'
          else
            ${{ matrix.python }} scripts/release/ci.py failure-stage 2>/dev/null || echo 'stage=config'
            echo 'Cleanup failed.'
            exit 1
          fi

  tools-publish:
    needs: tools-build
    if: ${{ !cancelled() && inputs.mode == 'tools' && needs['tools-build'].result == 'success' }}
    permissions:
      contents: read
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: everroam/lisbit
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false
      - name: Publish tools
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if python3 scripts/release/ci.py tools-publish > "$RUNNER_TEMP/tools.log" 2>&1; then
            echo 'Tools publication completed.'
          else
            python3 scripts/release/ci.py failure-stage 2>/dev/null || echo 'stage=config'
            echo 'Tools publication failed.'
            exit 1
          fi
